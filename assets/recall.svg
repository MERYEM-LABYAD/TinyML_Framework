<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Recall per class: original detector versus maximal compressed model">
<defs><style>
text{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#C9D6DF}
.v{font-family:Consolas,Menlo,monospace;font-size:13px;fill:#fff}
</style></defs>
<rect width="760" height="300" rx="14" fill="#0E1A2C"/>
<text x="24" y="32" font-size="15" font-weight="600" style="fill:#fff">What compression costs: recall per class</text>
<g stroke="#2A3C54"><path d="M40 250H730"/><path d="M40 190H730" stroke-dasharray="3 6"/><path d="M40 130H730" stroke-dasharray="3 6"/><path d="M40 70H730" stroke-dasharray="3 6"/></g>
<!-- bars: baseline y=250, scale 1.8px per % -->
<g>
<!-- Healthy -->
<rect x="90" y="250" width="56" height="0" fill="#5F7A91"><animate attributeName="height" from="0" to="174" dur="1.1s" begin="0.2s" fill="freeze"/><animate attributeName="y" from="250" to="76" dur="1.1s" begin="0.2s" fill="freeze"/></rect>
<rect x="154" y="250" width="56" height="0" fill="#2FE3B0"><animate attributeName="height" from="0" to="171" dur="1.1s" begin="0.4s" fill="freeze"/><animate attributeName="y" from="250" to="79" dur="1.1s" begin="0.4s" fill="freeze"/></rect>
<text x="118" y="68" text-anchor="middle" class="v">96.8</text><text x="182" y="71" text-anchor="middle" class="v">94.8</text>
<text x="150" y="274" text-anchor="middle" font-size="14">No issues</text>
<!-- Broken -->
<rect x="320" y="250" width="56" height="0" fill="#5F7A91"><animate attributeName="height" from="0" to="161" dur="1.1s" begin="0.6s" fill="freeze"/><animate attributeName="y" from="250" to="89" dur="1.1s" begin="0.6s" fill="freeze"/></rect>
<rect x="384" y="250" width="56" height="0" fill="#FF6B4A"><animate attributeName="height" from="0" to="107" dur="1.1s" begin="0.8s" fill="freeze"/><animate attributeName="y" from="250" to="143" dur="1.1s" begin="0.8s" fill="freeze"/></rect>
<text x="348" y="81" text-anchor="middle" class="v">89.3</text><text x="412" y="135" text-anchor="middle" class="v">59.7</text>
<text x="380" y="274" text-anchor="middle" font-size="14">Broken</text>
<!-- Flashover -->
<rect x="550" y="250" width="56" height="0" fill="#5F7A91"><animate attributeName="height" from="0" to="151" dur="1.1s" begin="1s" fill="freeze"/><animate attributeName="y" from="250" to="99" dur="1.1s" begin="1s" fill="freeze"/></rect>
<rect x="614" y="250" width="56" height="0" fill="#FF6B4A"><animate attributeName="height" from="0" to="110" dur="1.1s" begin="1.2s" fill="freeze"/><animate attributeName="y" from="250" to="140" dur="1.1s" begin="1.2s" fill="freeze"/></rect>
<text x="578" y="91" text-anchor="middle" class="v">83.9</text><text x="642" y="132" text-anchor="middle" class="v">61.2</text>
<text x="610" y="274" text-anchor="middle" font-size="14">Flashover</text>
</g>
<g font-size="12"><rect x="520" y="14" width="10" height="10" fill="#5F7A91"/><text x="536" y="24">original</text><rect x="600" y="14" width="10" height="10" fill="#FF6B4A"/><text x="616" y="24">compressed (61.7 %)</text></g>
</svg>
